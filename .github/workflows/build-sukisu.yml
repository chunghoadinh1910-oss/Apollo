name: Build Apollo Kernel with SukiSU Ultra
on:
  workflow_dispatch: # Cho phép bạn kích hoạt build thủ công từ giao diện GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
  - name: Checkout Apollo Kernel Source
  uses: actions/checkout@v5  # Đã nâng cấp từ v4 lên v5
  with:
    repository: 'ananjaser1211/Apollo'
    ref: 'master'
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Clone and Setup Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/llvm/llvm-project.git -b llvmorg-18.1.8 ${{ github.workspace }}/toolchain
          echo "${{ github.workspace }}/toolchain/bin" >> $GITHUB_PATH

      - name: Integrate SukiSU Ultra (Non-GKI)
        run: |
          # Sử dụng script 'nongki' dành riêng cho kernel 4.9
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

      - name: Configure Kernel (Defconfig)
        run: |
          # Bật các cấu hình bắt buộc cho SukiSU trên kernel non-GKI
          DEFCONFIG="arch/arm64/configs/exynos9810-crownlte_defconfig"
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG # Bắt buộc cho kernel < 4.14
          # Ghi đè cấu hình mặc định
          make ARCH=arm64 exynos9810-crownlte_defconfig

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make -j$(nproc --all) CC=clang LLVM=1 Image

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Kernel-SukiSU-Image
          path: arch/arm64/boot/Image
