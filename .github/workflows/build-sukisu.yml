name: Build Apollo Kernel with SukiSU Ultra
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apollo Kernel Source (Fork ổn định)
        uses: actions/checkout@v4
        with:
          repository: 'duhansysl/exynos9810-kernel'
          fetch-depth: 1
          submodules: false

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 zstd

      - name: Download and Setup Clang 18 Toolchain (Greenforce)
        run: |
          curl -LSs "https://github.com/greenforce-project/clang-llvm/releases/download/04102023/greenforce-clang-18.0.0-04102023-1050.tar.zst" -o clang.tar.zst
          mkdir clang
          tar --zstd -xf clang.tar.zst -C clang --strip-components=1
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: Integrate SukiSU Ultra (Non-GKI)
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

      - name: Fix BPF Redefinition (Sửa lỗi trùng lặp hàm)
        run: |
          echo "Đang tìm và xóa định nghĩa trùng lặp của hàm __bpf_prog_charge..."
          LINE_START=$(grep -n "static inline int __bpf_prog_charge" include/linux/bpf.h | tail -1 | cut -d: -f1)
          if [ -n "$LINE_START" ]; then
            LINE_END=$(awk -v start="$LINE_START" 'NR>=start && /^}/{print NR; exit}' include/linux/bpf.h)
            sed -i "${LINE_START},${LINE_END}d" include/linux/bpf.h
          fi
          LINE_START_U=$(grep -n "static inline void __bpf_prog_uncharge" include/linux/bpf.h | tail -1 | cut -d: -f1)
          if [ -n "$LINE_START_U" ]; then
            LINE_END_U=$(awk -v start="$LINE_START_U" 'NR>=start && /^}/{print NR; exit}' include/linux/bpf.h)
            sed -i "${LINE_START_U},${LINE_END_U}d" include/linux/bpf.h
          fi

      - name: Fix Exynos Header Conflicts (Macro & Missing console.h)
        run: |
          echo "1. Xóa định nghĩa macro s3c2410wdt_set_emergency_reset trong exynos-ss.h..."
          # Xóa hẳn dòng #define gây xung đột
          if [ -f include/linux/exynos-ss.h ]; then
            sed -i '/#define s3c2410wdt_set_emergency_reset/d' include/linux/exynos-ss.h
            echo "Đã xóa macro trong exynos-ss.h."
          fi

          echo "2. Thêm #undef vào exynos-condbg.h để đảm bảo không còn xung đột..."
          if [ -f include/soc/samsung/exynos-condbg.h ]; then
            # Chèn #undef vào đầu file
            sed -i '1i #undef s3c2410wdt_set_emergency_reset' include/soc/samsung/exynos-condbg.h
            echo "Đã chèn #undef vào exynos-condbg.h."
          fi

          echo "3. Khắc phục lỗi thiếu file console.h..."
          # Tạo thư mục đích nếu chưa có
          mkdir -p drivers/soc/samsung/cal-if
          # Tìm console.h trong include/linux (vị trí chuẩn)
          if [ -f include/linux/console.h ]; then
            ln -sf $(pwd)/include/linux/console.h drivers/soc/samsung/cal-if/console.h
            echo "Đã tạo symlink từ include/linux/console.h."
          else
            # Dự phòng: tìm trong drivers/tty
            CONSOLE_H=$(find drivers/tty -name "console.h" 2>/dev/null | head -1)
            if [ -n "$CONSOLE_H" ]; then
              ln -sf $(pwd)/$CONSOLE_H drivers/soc/samsung/cal-if/console.h
              echo "Đã tạo symlink từ $CONSOLE_H."
            else
              echo "CẢNH BÁO: Không tìm thấy console.h ở bất kỳ đâu!"
            fi
          fi

      - name: Backport set_memory.h for Kernel < 4.19
        run: |
          curl -LSs "https://raw.githubusercontent.com/torvalds/linux/v4.19/arch/x86/include/asm/set_memory.h" -o /tmp/set_memory_4.19.h
          sudo mkdir -p arch/arm64/include/asm
          sudo cp /tmp/set_memory_4.19.h arch/arm64/include/asm/set_memory.h

      - name: Configure Kernel (Defconfig)
        run: |
          DEFCONFIG="arch/arm64/configs/crownlte_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
            echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
            echo "CONFIG_KPROBES=y" >> $DEFCONFIG
            echo "CONFIG_KSU=y" >> $DEFCONFIG
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
            make ARCH=arm64 crownlte_defconfig
          else
            echo "LỖI: Không tìm thấy file $DEFCONFIG."
            exit 1
          fi

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make -j$(nproc --all) CC=clang LLVM=1 Image

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Kernel-SukiSU-Image
          path: arch/arm64/boot/Image
